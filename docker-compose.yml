version: '3.8'

services:
  shothik-hermes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shothik-hermes-core
    ports:
      - "8080:8080"
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - OLLAMA_HOST=http://host.docker.internal:11434
      - INSFORGE_PROJECT=oss-project
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
