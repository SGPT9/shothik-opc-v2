services:
  shothik-hermes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shothik-hermes-core
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - OLLAMA_HOST=http://host.docker.internal:11434
      - DEERFLOW_API_URL=http://deerflow:8000
      - BANGLA_AUDIO_AI_URL=http://bangla-audio-ai:8001
      - INSFORGE_PROJECT=oss-project
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  deerflow:
    build:
      # Dockerfile does `COPY backend ./backend`, so the context must be the repo root.
      context: ./deerflow_repo
      dockerfile: backend/Dockerfile
    container_name: deerflow-backend
    # Image default listens on 8001; the gateway contract in this stack is :8000.
    command: ["sh", "-c", "cd backend && PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=info
      # Passed through from the host shell / .env; never baked into the image.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes:
      # Gateway searches cwd (/app/backend) and its parent (/app) for config.yaml.
      - ./deerflow_repo/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  bangla-audio-ai:
    build:
      context: ../bangla-audio-ai
      dockerfile: Dockerfile
    container_name: bangla-audio-ai-voice
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
