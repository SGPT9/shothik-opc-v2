services:
  # 1. Ask-First Frontend Shell (shothikgpt.com)
  frontend:
    build:
      context: .
      dockerfile: artifacts/shothik/Dockerfile
    container_name: shothik-frontend-prod
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - API_SERVER_URL=http://api-server:8080
      - VITE_API_URL=/api
      - VITE_WS_URL=wss://ws.shothikgpt.com
    ports:
      - "5000:5000"
    networks:
      - shothik-mesh

  # 2. Unified Backend API Gateway (api.shothikgpt.com)
  api-server:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    container_name: shothik-api-prod
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=8080
      - REDIS_URL=redis://redis:6379
      - SEARXNG_URL=http://searxng:8080
      - OLLAMA_HOST=http://host.docker.internal:11434
      - DEERFLOW_BACKEND_URL=http://deerflow:8000
      - BANGLA_AUDIO_AI_URL=http://bangla-audio-ai:8001
    volumes:
      - ./data:/app/data
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - searxng
      - deerflow
      - bangla-audio-ai
    networks:
      - shothik-mesh

  # 3. Redis Priority Queue & Semantic Cache (BullMQ)
  redis:
    image: redis:7-alpine
    container_name: shothik-redis-prod
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - shothik-mesh

  # 4. Zero-Cost Local Search Proxy (SearXNG)
  searxng:
    image: searxng/searxng:latest
    container_name: shothik-searxng-prod
    restart: always
    environment:
      - SEARXNG_BASE_URL=https://api.shothikgpt.com/search
    networks:
      - shothik-mesh

  # 5. DeerFlow Deep Research Engine (LangGraph Python 3.12)
  deerflow:
    build:
      context: ./deerflow_repo/backend
      dockerfile: Dockerfile
    container_name: shothik-deerflow-prod
    restart: always
    environment:
      - LOG_LEVEL=info
      - PORT=8000
    networks:
      - shothik-mesh

  # 6. Bangla Audio AI Voice Synthesis (OpenVINO Python 3.11)
  bangla-audio-ai:
    build:
      context: ../bangla-audio-ai
      dockerfile: Dockerfile
    container_name: shothik-bangla-audio-prod
    restart: always
    environment:
      - PORT=8001
      - PYTHONUNBUFFERED=1
    networks:
      - shothik-mesh

networks:
  shothik-mesh:
    driver: bridge

volumes:
  redis-data:
