name: Release Automation & Semver

# Enterprise Actions policy restricts GITHUB_TOKEN from creating PRs (409).
# Run manually via workflow_dispatch (or restore `push: branches: [main]` once a
# RELEASE_PLEASE_TOKEN PAT or org-level PR creation permission is enabled).
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          release-type: node
          package-name: shothik-opc-v2
          changelog-types: '[{"type":"feat","section":"Features","hidden":false},{"type":"fix","section":"Bug Fixes","hidden":false},{"type":"perf","section":"Performance Improvements","hidden":false}]'

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        if: ${{ steps.release.outputs.release_created }}
        with:
          version: 11

      - name: Publish to NPM / GitHub Packages
        if: ${{ steps.release.outputs.release_created }}
        run: echo "Release ${{ steps.release.outputs.tag_name }} published successfully."
