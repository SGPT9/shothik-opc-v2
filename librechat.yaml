# Shothik AI + LibreChat Unified Architecture Configuration
# https://www.librechat.ai/docs/configuration/librechat_yaml

version: 1.3.14
cache: true

# ── 1. Custom Endpoint Gateway (DeepSeek MoE + Local Ollama + InsForge) ──
endpoints:
  custom:
    - name: "Shothik Core (DeepSeek V4 MoE)"
      apiKey: "${DEEPSEEK_API_KEY}"
      baseURL: "https://api.deepseek.com/v1"
      models:
        default: ["deepseek-chat", "deepseek-reasoner"]
        fetch: false
      titleConvo: true
      titleModel: "deepseek-chat"
      summarize: true
      summaryModel: "deepseek-chat"
      forcePrompt: false
      modelDisplayLabel: "DeepSeek V4 MoE"

    - name: "Local Ollama GPU (Port 11434)"
      apiKey: "ollama"
      baseURL: "http://localhost:11434/v1"
      models:
        default: ["deepseek-r1:8b", "llama3.2:3b", "qwen2.5-coder:7b"]
        fetch: true
      titleConvo: true
      modelDisplayLabel: "Local Ollama GPU"

    - name: "InsForge AI Gateway"
      apiKey: "${INSFORGE_API_KEY}"
      baseURL: "https://ers8j28a.ap-southeast.insforge.app/v1"
      models:
        default: ["insforge-gemini-2.0-flash", "insforge-deepseek-v4"]
        fetch: false
      modelDisplayLabel: "InsForge BaaS Gateway"

# ── 2. Shothik Demographic MCP Servers ──
mcpServers:
  shothik-commerce:
    command: "node"
    args:
      - "artifacts/shothik/src/lib/mcp/shothik-mcp-server.cjs"
    description: "South Asian Commerce Rail: bKash/Nagad TrxID verification, Steadfast courier booking, and COD return fraud defense"

  shothik-vat:
    command: "node"
    args:
      - "artifacts/shothik/src/lib/mcp/shothik-vat-server.cjs"
    description: "Bangladesh NBR VAT Act 2012 & Income Tax Act 2023 Mushak-6.3 challan generator"

# ── 3. Shothik Autonomous Agent Presets (Twin AI, Merchant, Academic, Writer) ──
presets:
  - title: "Twin AI — Autonomous Co-Founder"
    endpoint: "custom"
    model: "deepseek-chat"
    modelLabel: "Twin AI"
    greeting: "Hello, I am your Twin AI autonomous co-founder. I monitor your business metrics, reconcile MFS cashflow, and plan overnight goals. What shall we tackle today?"
    promptPrefix: |
      You are Twin AI, the autonomous co-founder for South Asian entrepreneurs and merchants.
      You possess deep expertise in business strategy, bKash/Nagad reconciliation, Steadfast courier routing, and growth modeling.
      Always be proactive, concise, structured, and strategic.

  - title: "F-Commerce Merchant Copilot"
    endpoint: "custom"
    model: "deepseek-chat"
    modelLabel: "Merchant Copilot"
    greeting: "Welcome to Shothik Commerce Hub. I can help verify bKash TrxIDs, calculate COD return risks, and generate Steadfast courier tracking links."
    promptPrefix: |
      You are the Shothik F-Commerce & Logistics Copilot.
      You understand Banglish conversational commerce (e.g. 'bhai parcel ta kothay?'), Steadfast parcel APIs, bKash idempotency rules, and 10-minute stock locks.

  - title: "Academic & Thesis Research Agent"
    endpoint: "custom"
    model: "deepseek-reasoner"
    modelLabel: "Research Grounding"
    greeting: "I am your Deep Research Academic Assistant. I fact-check against PubMed, arXiv, and OpenAlex with APA 7th / IEEE citations and Turnitin-safe formatting."
    promptPrefix: |
      You are the Academic Research Grounding Agent.
      Provide structured, rigorous, evidence-based responses with exact inline citations [1], [2] and full bibliographies.

  - title: "Writing Studio Pro & BoiMela 3D"
    endpoint: "custom"
    model: "deepseek-chat"
    modelLabel: "Writing Studio"
    greeting: "Welcome to Writing Studio Pro. I format Nilkhet 6x9 Royal Demy book printing layouts, generate Amar Ekushey 3D page flips, and craft manuscript chapters."
    promptPrefix: |
      You are the Master Editor and Book Publishing Architect.
      You design rich manuscript narratives, scene beats, and Royal Demy print-ready formatting under Unicode / Bijoy standards.

# ── 4. UI & Ergonomics Configuration ──
interface:
  privacyPolicy:
    externalUrl: "https://shothik.ai/privacy"
    openNewTab: true
  termsOfService:
    externalUrl: "https://shothik.ai/terms"
    openNewTab: true
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  bookmarks: true
